<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>BusinessOS</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#C2410C" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/dexie@3.2.4/dist/dexie.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
</head>
<body>
  <div id="app" x-data="app()" x-init="init()">
    <header class="topbar">
      <span class="topbar-title" x-text="screenTitle"></span>
    </header>

    <main class="content">
      <template x-if="screen === 'home'">
        <div class="dashboard">
          <template x-if="lowStockItems.length > 0">
            <div class="alert-banner">
              ⚠ Low stock: <span x-text="lowStockItems.length"></span>
              <span x-text="lowStockItems.length === 1 ? 'item' : 'items'"></span>
            </div>
          </template>

          <div class="metric-grid">
            <div class="metric-card">
              <span class="metric-label">Revenue</span>
              <span class="metric-value" x-text="formatCurrency(todayRevenue)"></span>
            </div>
            <div class="metric-card" :class="{ 'metric-card--negative': todayProfit < 0 }">
              <span class="metric-label">Profit</span>
              <span class="metric-value" x-text="formatCurrency(todayProfit)"></span>
            </div>
            <div class="metric-card">
              <span class="metric-label">Expenses</span>
              <span class="metric-value" x-text="formatCurrency(todayExpenses)"></span>
            </div>
            <div class="metric-card">
              <span class="metric-label">Jobs pending</span>
              <span class="metric-value" x-text="jobsPendingCount"></span>
            </div>
          </div>

          <template x-if="!dashboardLoading && todayRevenue === 0 && todayExpenses === 0 && jobsPendingCount === 0 && lowStockItems.length === 0">
            <p class="dashboard-empty">No activity yet today — these numbers update as jobs and bills come in.</p>
          </template>
        </div>
      </template>
      <template x-if="screen === 'jobs'">
        <div class="placeholder-screen"><p>Jobs — coming soon.</p></div>
      </template>
      <template x-if="screen === 'bill'">
        <div class="placeholder-screen"><p>New Bill — coming soon.</p></div>
      </template>
      <template x-if="screen === 'inventory'">
        <div class="placeholder-screen"><p>Inventory — coming soon.</p></div>
      </template>
      <template x-if="screen === 'more'">
        <div class="placeholder-screen"><p>More — coming soon.</p></div>
      </template>
    </main>

    <nav class="bottom-nav">
      <button :class="{active: screen === 'home'}" @click="go('home')">
        <span class="nav-icon">⌂</span><span class="nav-label">Home</span>
      </button>
      <button :class="{active: screen === 'jobs'}" @click="go('jobs')">
        <span class="nav-icon">📋</span><span class="nav-label">Jobs</span>
      </button>
      <button :class="{active: screen === 'bill'}" @click="go('bill')">
        <span class="nav-icon">➕</span><span class="nav-label">Bill</span>
      </button>
      <button :class="{active: screen === 'inventory'}" @click="go('inventory')">
        <span class="nav-icon">📦</span><span class="nav-label">Inventory</span>
      </button>
      <button :class="{active: screen === 'more'}" @click="go('more')">
        <span class="nav-icon">⋯</span><span class="nav-label">More</span>
      </button>
    </nav>
  </div>

  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((err) => console.warn('SW registration failed', err));
      });
    }
  </script>
</body>
</html>
